# SPLITMILK: build the package on GitHub, run the host tests, and on a tag vX.Y publish the release with a build
# attestation (actions/attest-build-provenance): the Firmware Hub shows "Built from source" for exactly these files.
# The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), three files of the AC79 SDK from
# gitee.com, as in sloopDX's and OberVave's workflows. Both are kept in GitHub's cache, so they are fetched only when
# the cache is empty; every download gives up and tries again if it stalls, and the job can never run for hours.
# A push that changes only text (the README, the docs, the credits) builds nothing. Run by hand (workflow_dispatch)
# for a test build without a release.
name: release

on:
  push:
    branches: [main]           # every push to main: a test build, the .fwsc under the run's Artifacts
    tags: ['v*']               # (a tag always builds: path filters do not apply to tags)
    paths-ignore:              # text only: nothing to build
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/samples/**.txt'
      - 'fmhub.json'
  workflow_dispatch:

env:
  AC79_SDK: /home/runner/ac79-sdk            # just the three SDK files the package needs (cached)
  JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
  SDK_TAG: AC79NN_SDK_V1.2.1_2023-12-13

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # (a stuck download can never hold the run for hours)
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (from the cache)
        id: tc
        uses: actions/cache@v4
        with:
          path: /home/runner/.jieli
          key: jieli-linux-toolchain-v1

      - name: JieLi toolchain (pkgman.jieliapp.com, when not cached)
        if: steps.tc.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do                     # (each try: at most 6 minutes, and a stall gives up after a minute)
            rm -rf /home/runner/.jieli
            mkdir -p /home/runner/.jieli
            timeout 360 sh -c 'curl -fL --speed-limit 2000 --speed-time 60 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C /home/runner/.jieli' && break
            echo "toolchain download failed (try $i), trying again"
            sleep 20
          done
          TC="$(ls -d /home/runner/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" /home/runner/.jieli/toolchain
          test -x /home/runner/.jieli/toolchain/pi32v2/bin/clang

      - name: JieLi AC79 SDK files (from the cache)
        id: sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/ac79-sdk
          key: ac79-sdk-files-${{ env.SDK_TAG }}

      - name: JieLi AC79 SDK files (gitee.com, when not cached)
        if: steps.sdk.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          for i in 1 2 3; do                     # (gitee.com is slow from here and drops clones: each try at most
            rm -rf /home/runner/sdk-clone        #  6 minutes, a stall (under 1 KB/s for a minute) gives up)
            timeout 360 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone --depth 1 --branch "$SDK_TAG" \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git /home/runner/sdk-clone && break
            echo "SDK clone failed (try $i), trying again"
            sleep 20
          done
          T=cpu/wl82/tools
          mkdir -p "$AC79_SDK/$T/cfg"
          cp /home/runner/sdk-clone/$T/uboot.boot /home/runner/sdk-clone/$T/cfg_tool.bin "$AC79_SDK/$T/"
          cp /home/runner/sdk-clone/$T/cfg/eq_cfg_hw.bin "$AC79_SDK/$T/cfg/"
          rm -rf /home/runner/sdk-clone
          cd "$AC79_SDK/$T"                      # (only the right files go in the cache: the build's own hashes)
          echo "4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4  uboot.boot
          276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b  cfg_tool.bin
          41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d  cfg/eq_cfg_hw.bin" | sed 's/^ *//' | sha256sum -c -

      - name: Build (the FM-1)
        timeout-minutes: 15
        run: sh build.sh

      - name: Host tests
        timeout-minutes: 15
        run: sh tests/run_tests.sh

      - name: Release packages (tags only)
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          sh build.sh --release "$V"
          ls -l build/splitmilk-"$V"*.fwsc
          (cd build && sha256sum splitmilk-"$V"*.fwsc > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: splitmilk-fwsc
          path: build/splitmilk*.fwsc
          if-no-files-found: error

      - name: Attest the packages (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/splitmilk-[0-9]*.fwsc

      # (the release builds only, not the dev ones: splitmilk-smk37.fwsc – no comment inside the block below: it would be part of the pattern)
      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/splitmilk-[0-9]*.fwsc
            build/SHA256SUMS
          generate_release_notes: true
